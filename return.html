<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quay về VCC</title></head><body><script>
(function(){
 const u=new URL(location.href), raw=u.search+u.hash;
 const embedded=[...raw.matchAll(/(?:[?&])status=([^&#]+)/gi)].map(m=>m[1]);
 const failures=[];
 for(const [k,v] of u.searchParams.entries()){
  if(/^(error|err|error_code|errorcode|failed|failure)$/i.test(k)&&v&&!/^(0|false|none|no|null)$/i.test(v))failures.push(k);
  if(/^(status|result|state|success)$/i.test(k)&&/^(failed|failure|error|cancel|cancelled|canceled|reject|rejected|0|false)$/i.test(v))failures.push(k);
 }
 if(embedded.some(v=>/^(failed|failure|error|cancel|cancelled|canceled|0|false)$/i.test(v)))failures.push('status');
 const status=u.searchParams.get('status')||embedded[0]||'';
 const target=new URL('index.html',u.href);
 target.searchParams.set('vcc_return','1');
 if(failures.length)target.searchParams.set('vcc_failed','1');
 else if(status==='1')target.searchParams.set('vcc_status','1');
 location.replace(target.href);
})();
</script></body></html>
