<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị · Đặt món</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🔐 Quản trị đặt món</h1><button id="logout" class="secondary hidden">Đăng xuất</button></header><main><div id="notice" class="status hidden"></div><section id="login" class="box"><h2>Đăng nhập quản trị</h2><div class="row"><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button id="signIn">Đăng nhập</button></div></section><div id="dashboard" class="hidden"><section class="box"><h2>Đợt đặt hàng</h2><div id="roundState" class="pill"></div><div class="row" style="margin-top:15px"><input id="roundName" placeholder="Tên đợt mới, ví dụ: Trà chiều 6/11"><button id="newRound">Tạo đợt mới</button><button class="secondary" id="toggleLock">Khóa / Mở khóa</button><button class="danger" id="archiveRound">Kết thúc & lưu lịch sử</button></div></section><section class="box"><h2>Tổng hợp đơn</h2><div id="stats" class="grid"></div><p class="muted">Chỉ hiển thị đơn thuộc đợt hiện tại.</p><button class="secondary" id="refreshOrders">Làm mới</button> <button id="exportOrders">Xuất Excel (CSV)</button><div class="table-wrap"><table><thead><tr><th>Người đặt</th><th>Quán / Món</th><th>Số tiền</th><th>Thanh toán</th><th>Thời gian</th></tr></thead><tbody id="orderRows"></tbody></table></div></section><section class="box"><h2>Quản lý thành viên</h2><div class="row"><input id="memberName" placeholder="Tên nhân viên"><button id="addMember">Thêm tên</button></div><div id="memberList"></div></section><section class="box"><h2>Quản lý quán</h2><div class="row"><input id="restaurantName" placeholder="Tên quán"><button id="addRestaurant">Thêm quán</button></div><div id="restaurantList"></div></section><section class="box"><h2>Quản lý món ăn</h2><div class="row"><select id="menuRestaurant"></select><input id="menuName" placeholder="Tên món"><input id="menuCategory" placeholder="Danh mục (không bắt buộc)"><input id="priceM" type="number" min="0" placeholder="Giá M"><input id="priceL" type="number" min="0" placeholder="Giá L (nếu có)"><button id="addMenu">Thêm món</button></div><div id="menuAdminList"></div></section><section class="box"><h2>Lịch sử đã chốt</h2><button id="exportArchive">Xuất toàn bộ lịch sử (CSV)</button><div id="archiveList"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
