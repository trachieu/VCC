<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt món</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🍵 Đặt món</h1><span id="hello" class="muted"></span></header><main><div id="notice" class="status hidden"></div><section id="login" class="box"><h2>Chọn tên để bắt đầu</h2><input class="search" id="personSearch" placeholder="Gõ tên để tìm..." autocomplete="off"><div id="hintList"></div><p id="selectedName" class="muted">Chưa chọn tên</p><button id="goBtn" disabled>Vào đặt món →</button></section><div id="app" class="hidden"><section class="box"><div class="row spread"><div><h2 id="welcome"></h2><span id="roundInfo" class="pill"></span></div><button class="secondary" id="changePerson">Đổi tên</button></div><div class="tabs"><button class="secondary" id="tabRestaurants">Chọn quán</button><button class="secondary" id="tabOrders">Đơn của tôi</button></div></section><section id="restaurantsSection" class="box"><h2>Chọn quán</h2><div id="restaurants" class="grid"></div></section><section id="menuSection" class="box hidden"><div class="row spread"><h2 id="restTitle">Menu</h2><button class="secondary" id="backRestaurants">← Quay lại</button></div><input class="search" id="searchMenu" placeholder="Tìm món..."><div id="menuList" class="grid" style="margin-top:12px"></div></section><section id="myOrdersSection" class="box hidden"><h2>Đơn của tôi</h2><div id="ordersList"></div></section></div></main><div id="sticky" class="sticky hidden"><strong id="cartCount">0 món</strong><button id="openCart">🛒 Giỏ hàng · <span id="cartTotal">0đ</span></button></div><div class="modal hidden" id="itemModal"><div class="box"><div class="row spread"><h2 id="modalName">Chọn món</h2><button class="secondary" id="closeModal">✕</button></div><div id="sizes" class="tabs"></div><h3>Đường</h3><div id="sugars"></div><h3>Đá</h3><div id="ices"></div><h3>Topping</h3><div id="toppings"></div><h3>Số lượng</h3><input id="qty" type="number" min="1" max="30" value="1"><h3>Ghi chú</h3><input id="note" class="search" placeholder="Không bắt buộc" maxlength="160"><p id="lineTotal" class="summary"></p><button class="full" id="addToCart">Thêm vào giỏ</button></div></div><div class="modal hidden" id="cartModal"><div class="box"><div class="row spread"><h2>Giỏ hàng</h2><button class="secondary" id="closeCart">✕</button></div><div id="cartLines"></div><h2 id="sumCart"></h2><button id="placeOrder" class="full">Xác nhận đặt hàng</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="common.js"></script><script src="member.js"></script></body></html>
